<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is outer wilds yet</title>
    <style>
        /* On supprime les marges/paddings du body et html */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* évite les scrollbars */
        }

        /* Canvas prend tout l'écran */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body style="margin: 0 !important;padding: 0 !important;">
    <canvas id="canvas"></canvas>
    <label id="coins" style="position:absolute; top:0%;color: burlywood; padding: 1%;">Coins : 0</label>
    <script>
    const canvas = document.getElementById('canvas');

    function resizeCanvas() {
        // Taille réelle du canvas en pixels (résolution)
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Taille affichée en CSS (toujours 100%)
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";

        // Optionnel : si tu veux que Emscripten sache la nouvelle taille
        if (typeof Module !== "undefined" && Module.canvas === canvas) {
            if (Module.setCanvasSize) Module.setCanvasSize(canvas.width, canvas.height);
        }
    }

    // Redimension initial
    resizeCanvas();

    // Redimension dynamique
    window.addEventListener('resize', resizeCanvas);

    var nbCoins = 0;
    const d = new Date();
    var startTime = d.getTime();
    function foundCoin()
    {
        nbCoins += 1;
        document.getElementById("coins").innerText = "Coins : " + nbCoins;
        if(nbCoins >= 8)
        {
            alert("Congratulations ! You found all the coins. Time : " + (d.getTime() - startTime));
        }
    }
    </script>
    <script src="main.js"></script>
</body>
</html>
